# HR Properties Backend — Docker Compose
# Stack: Django + PostgreSQL + alert-cron + Cloudflare Tunnel
# Sin puertos expuestos — cloudflared maneja el ingress

services:
  # ===== Backend: Django + DRF + Gunicorn =====
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Django core
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-backend,localhost,127.0.0.1}
      # Database
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-hr-properties}
      DB_USER: ${POSTGRES_USER:-hr}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: postgres
      DB_PORT: "5432"
      # CORS — URL pública del frontend (para peticiones directas del SPA)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      # Admin emails (comma-separated)
      ADMIN_EMAILS: ${ADMIN_EMAILS:?ADMIN_EMAILS is required}
      # Gmail SMTP
      GMAIL_USER: ${GMAIL_USER:?GMAIL_USER is required}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD:?GMAIL_PASSWORD is required}
    volumes:
      # Media files: persisted across restarts
      - media-data:/app/media
      # Static files
      - static-data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
    # No ports: — cloudflared routes to http://backend:8000 internally

  # ===== Database: PostgreSQL 16 =====
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hr-properties}
      POSTGRES_USER: ${POSTGRES_USER:-hr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hr} -d ${POSTGRES_DB:-hr-properties}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===== Alertas automáticas: cron diario =====
  # Reemplaza el GitHub Actions workflow (deploy.yml) que no puede alcanzar
  # la base de datos dentro del stack de Docker.
  alert-cron:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: []
    command: >
      sh -c "while true; do
        sleep 86400;
        python manage.py send_due_alerts --alert-days 5 1;
      done"
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEBUG: "False"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-hr-properties}
      DB_USER: ${POSTGRES_USER:-hr}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: postgres
      DB_PORT: "5432"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?ADMIN_EMAILS is required}
      GMAIL_USER: ${GMAIL_USER:?GMAIL_USER is required}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD:?GMAIL_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy

  # ===== Cloudflare Tunnel: acceso público sin exponer puertos =====
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres-data:
  media-data:
  static-data: